name: Update streak stats

on:
  schedule:
    - cron: "50 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-streak.yml"
      - "README.md"
  workflow_run:
    workflows:
      - Update daily quote
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-streak
  cancel-in-progress: false

jobs:
  update-streak:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&timezone=Asia/Shanghai&disable_animations=true
          path: images/streak.svg

      - name: Commit changes
        run: |
          git add images/streak.svg
          if git diff --cached --quiet -- images/streak.svg; then
            echo "No streak changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update streak stats"
          git pull --rebase origin main
          git push origin HEAD:main
